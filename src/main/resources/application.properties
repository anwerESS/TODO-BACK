spring.application.name=TODO-BACK

spring.datasource.url=jdbc:h2:mem:todo-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

app.security.jwt.issuer=todo-back
app.security.jwt.secret=${JWT_SECRET:dev-only-todo-back-jwt-secret-change-me-please-32-bytes-minimum}
app.security.jwt.expiration=PT1H

app.security.default-user.username=${DEFAULT_USER_USERNAME:user}
app.security.default-user.password=${DEFAULT_USER_PASSWORD:1234}
